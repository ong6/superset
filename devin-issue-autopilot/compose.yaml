services:
  watch:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: python -m autopilot watch
    environment:
      AUTOPILOT_DB: /data/autopilot.db
      AUTOPILOT_DAILY_ACU_CAP: ${AUTOPILOT_DAILY_ACU_CAP:-20}
      DEVIN_API_KEY: ${DEVIN_API_KEY:-}
      DEVIN_ORG_ID: ${DEVIN_ORG_ID:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-ong6/superset}
    volumes:
      - autopilot-data:/data
      - ./reports:/app/reports
    restart: unless-stopped

  report:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    command: python -m autopilot report
    profiles: [report]
    environment:
      AUTOPILOT_DB: /data/autopilot.db
    volumes:
      - autopilot-data:/data
      - ./reports:/app/reports

volumes:
  autopilot-data:
