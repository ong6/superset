[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-issue-autopilot"
version = "0.1.0"
description = "Bounded Devin issue remediation controller"
requires-python = ">=3.12"
dependencies = [
  "httpx==0.28.1",
  "pydantic==2.11.7",
  "typer==0.16.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.setuptools.packages.find]
include = ["autopilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["autopilot"]
