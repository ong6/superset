name: Devin issue automation

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to process"
        required: false
        type: number
      mode:
        description: "Run triage, approved remediation, or reporting"
        required: true
        default: triage
        type: choice
        options:
          - triage
          - remediate
          - report

permissions:
  contents: read

env:
  # Update only after Docker tests and simulation pass for the new revision.
  AUTOPILOT_REVISION: 9e89f45ebac39bc44f3fb27fd7440fbdc5354c3f

concurrency:
  group: devin-issue-${{ github.repository_id }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode != 'report') ||
      (github.event_name == 'issues' &&
       (github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' &&
         (github.event.label.name == 'devin-triage' ||
          github.event.label.name == 'devin-fix' ||
          github.event.label.name == 'devin-retry')))) ||
      github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Authorize and claim issue
        id: claim
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOPILOT_DISPATCH_MODE: ${{ inputs.mode }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const actor = context.actor;

            function skip(message) {
              core.warning(message);
              core.setOutput("claimed", "false");
            }

            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed("A positive issue number is required for triage or remediation.");
              return;
            }

            if (context.eventName === "issue_comment") {
              const command = (context.payload.comment.body || "").trim().toLowerCase();
              if (
                context.payload.issue.pull_request ||
                !["/devin fix", "/devin fix --again", "/devin retry"].includes(command)
              ) {
                skip("Ignoring non-Devin issue comment.");
                return;
              }
            }

            const labelDefinitions = [
              ["devin-fix", "ededed", "Authorized maintainer requested bounded remediation"],
              ["devin-retry", "D4C5F9", "Start a new bounded remediation generation"],
              ["devin-triage", "BFD4F2", "Request a new read-only Devin readiness brief"],
              ["devin-verified", "0E8A16", "Remediation PR passed configured verification"],
              ["devin-merged", "1D76DB", "Remediation PR merged after configured verification"],
              ["devin-needs-human", "B60205", "Remediation stopped and needs maintainer attention"],
              ["devin-candidate", "2DA44E", "Issue has a bounded remediation plan ready for approval"],
              ["devin-running", "1D76DB", "A bounded Devin remediation run owns this issue"],
              ["devin-exclude", "000000", "Opt this issue out of Devin automation"],
              ["devin-triaging", "FBCA04", "A bounded Devin triage run owns this issue"],
              ["devin-triaged", "C5DEF5", "Devin posted an issue triage brief"],
              ["devin-needs-maintainer", "BFDADC", "Maintainer decision required before automation proceeds"],
              ["devin-needs-info", "FEF2C0", "More reporter information is needed"],
              ["devin-triage-bug", "D73A4A", "Devin classified this issue as a bug"],
              ["devin-triage-feature", "A2EEEF", "Devin classified this issue as a feature request"],
              ["devin-triage-docs", "0075CA", "Devin classified this issue as documentation"],
              ["devin-triage-question", "D876E3", "Devin classified this issue as a question"],
              ["devin-triage-security", "EE0701", "Devin classified this issue as security-sensitive"],
              ["devin-triage-other", "EDEDED", "Devin could not classify this issue into a standard type"],
            ];
            for (const [name, color, description] of labelDefinitions) {
              try {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.updateLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                }
              }
            }

            let mode = "";
            let purpose = "";
            let requestedAt = "";
            let again = false;
            const event = context.eventName;
            const action = context.payload.action || "";
            if (event === "workflow_dispatch") {
              mode = process.env.AUTOPILOT_DISPATCH_MODE;
              purpose = mode === "triage" ? "triage" : "fix";
              requestedAt = new Date().toISOString();
            } else if (event === "issues") {
              if (action === "opened" || action === "reopened") {
                mode = "triage";
                purpose = "triage";
                requestedAt = context.payload.issue.updated_at ||
                  context.payload.issue.created_at;
              } else if (
                action === "labeled" &&
                ["devin-triage", "devin-fix", "devin-retry"].includes(
                  context.payload.label.name,
                )
              ) {
                mode = context.payload.label.name === "devin-triage"
                  ? "triage"
                  : "remediate";
                purpose = context.payload.label.name === "devin-retry"
                  ? "retry"
                  : mode === "triage"
                    ? "triage"
                    : "fix";
                requestedAt = context.payload.issue.updated_at ||
                  new Date().toISOString();
              } else {
                skip(`Ignoring issue action ${action}.`);
                return;
              }
            } else if (event === "issue_comment") {
              if (context.payload.issue.pull_request) {
                skip("Ignoring pull request comment.");
                return;
              }
              const command = (context.payload.comment.body || "").trim().toLowerCase();
              if (["/devin fix", "/devin fix --again", "/devin retry"].includes(command)) {
                mode = "remediate";
                purpose = command.endsWith("retry") ? "retry" : "fix";
                again = command === "/devin fix --again";
                requestedAt = context.payload.comment.created_at;
              } else {
                skip("Ignoring non-Devin issue comment.");
                return;
              }
            }

            if (!mode || !purpose || !requestedAt) {
              skip("No actionable Devin mode was selected.");
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });
            const labels = issue.labels.map(label =>
              typeof label === "string" ? label : label.name,
            );

            if (labels.includes("devin-exclude")) {
              skip(`Issue #${issue_number} is excluded from Devin automation.`);
              return;
            }

            if (
              event === "issues" &&
              action === "labeled" &&
              !labels.includes(context.payload.label.name)
            ) {
              skip(`Trigger label ${context.payload.label.name} is no longer present.`);
              return;
            }

            if (mode === "remediate") {
              let permission = "none";
              try {
                const response = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: actor,
                });
                permission = response.data.permission;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const authorized = ["admin", "maintain", "write"].includes(
                permission,
              );
              if (!authorized) {
                skip(
                  `Ignoring remediation request from ${actor} (${permission}).`,
                );
                return;
              }
            }

            const crypto = require("crypto");
            function section(name) {
              const escaped = name.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
              const match = (issue.body || "").match(
                new RegExp(`^## ${escaped}\\s*\\n(.*?)(?=^## |(?![\\s\\S]))`, "ms"),
              );
              return match ? match[1].trim() : "";
            }
            const acceptance = section("Acceptance command");
            const fencedAcceptance = acceptance.match(
              /^```[A-Za-z0-9_-]*\n(.*?)\n```$/s,
            );
            const contract = {
              acceptance_command: fencedAcceptance
                ? fencedAcceptance[1].trim()
                : acceptance,
              allowed_paths: section("Allowed paths")
                .split("\n")
                .filter(line => line.trim().startsWith("-"))
                .map(line => line.trim().slice(1).trim().replace(/^`+|`+$/g, "")),
              check_name: (
                (issue.body || "").match(/^CI check:\s*`?([^`\n]+)`?/im)?.[1] ||
                "unit-tests (current)"
              ).trim(),
              expected: section("Expected"),
              forbidden: section("Forbidden"),
              reproduction: section("Reproduction") || section("Repro"),
              symptom: section("Symptom"),
              title: issue.title.trim(),
            };
            const contractHash = crypto.createHash("sha256")
              .update(JSON.stringify(contract)).digest("hex").slice(0, 16);
            const requestKey = mode === "triage"
              ? `${issue_number}:${purpose}:${requestedAt}`
              : `${issue_number}:${purpose}:${contractHash}`;
            const digest = crypto.createHash("sha256").update(requestKey)
              .digest("hex").slice(0, 16);
            const marker = mode === "triage"
              ? `<!-- devin-triage-request:${digest} -->`
              : `<!-- devin-issue-autopilot:${digest} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            const completedComment = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" &&
              (comment.body || "").includes(marker)
            );
            if (!again && completedComment) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: [
                  `This issue contract already reached a terminal outcome: ${completedComment.html_url}`,
                  "",
                  "Update the issue contract or comment `/devin fix --again` to authorize another session.",
                ].join("\n"),
              });
              skip(`Request ${requestKey} already reached a terminal outcome.`);
              return;
            }

            const claimLabel = mode === "triage" ? "devin-triaging" : "devin-running";
            const activeClaim = ["devin-triaging", "devin-running"].find(
              label => labels.includes(label),
            );
            if (activeClaim) {
              skip(`Issue #${issue_number} already has active ${activeClaim}.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [claimLabel],
            });
            core.setOutput("claimed", "true");
            core.setOutput("mode", mode);
            core.setOutput("purpose", purpose);
            core.setOutput("actor", actor);
            core.setOutput("requested_at", requestedAt);
            core.setOutput("claim_label", claimLabel);
            core.setOutput("again", String(again));

      - name: Checkout pinned issue controller
        if: always()
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ong6/devin-issue-autopilot
          ref: ${{ env.AUTOPILOT_REVISION }}
          path: controller
          persist-credentials: false

      - name: Set up Python
        if: always()
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install issue controller
        if: always()
        run: python -m pip install ./controller

      - name: Restore controller state
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .autopilot-state/devin-issue-autopilot.db
          key: >-
            autopilot-db-${{ github.repository }}-${{ github.run_id }}-${{
            github.run_attempt }}
          restore-keys: |
            autopilot-db-${{ github.repository }}-

      - name: Run bounded issue automation
        if: steps.claim.outputs.claimed == 'true'
        env:
          AUTOPILOT_DAILY_ACU_CAP: "20"
          AUTOPILOT_DB: ${{ github.workspace }}/.autopilot-state/devin-issue-autopilot.db
          AUTOPILOT_MODE: ${{ steps.claim.outputs.mode }}
          AUTOPILOT_PURPOSE: ${{ steps.claim.outputs.purpose }}
          AUTOPILOT_REQUEST_ACTOR: ${{ steps.claim.outputs.actor }}
          AUTOPILOT_REQUEST_AT: ${{ steps.claim.outputs.requested_at }}
          AUTOPILOT_AGAIN: ${{ steps.claim.outputs.again }}
          DEVIN_API_KEY: ${{ steps.claim.outputs.mode == 'remediate' && secrets.DEVIN_API_KEY || '' }}
          DEVIN_TRIAGE_API_KEY: ${{ steps.claim.outputs.mode == 'triage' && secrets.DEVIN_TRIAGE_API_KEY || '' }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$(dirname "$AUTOPILOT_DB")"
          if [ "$AUTOPILOT_MODE" = "triage" ]; then
            python -m autopilot triage \
              --issue "$ISSUE_NUMBER" \
              --actor "$AUTOPILOT_REQUEST_ACTOR" \
              --requested-at "$AUTOPILOT_REQUEST_AT"
          else
            again_args=()
            if [ "$AUTOPILOT_AGAIN" = "true" ]; then
              again_args+=(--again)
            fi
            python -m autopilot once \
              --issue "$ISSUE_NUMBER" \
              --actor "$AUTOPILOT_REQUEST_ACTOR" \
              --requested-at "$AUTOPILOT_REQUEST_AT" \
              --purpose "$AUTOPILOT_PURPOSE" \
              "${again_args[@]}"
          fi

      - name: Save controller state
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .autopilot-state/devin-issue-autopilot.db
          key: >-
            autopilot-db-${{ github.repository }}-${{ github.run_id }}-${{
            github.run_attempt }}

      - name: Release issue claim
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOPILOT_CLAIM_LABEL: ${{ steps.claim.outputs.claim_label }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const claim = process.env.AUTOPILOT_CLAIM_LABEL;
            if (!claim) {
              core.setFailed("Claim label output is missing.");
              return;
            }
            let removed = false;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: claim,
                });
                removed = true;
                break;
              } catch (error) {
                if (error.status === 404) {
                  removed = true;
                  break;
                }
                core.warning(`Attempt ${attempt} could not remove ${claim}: ${error.message}`);
                if (attempt < 3) {
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }
            }
            if (removed) {
              try {
                const response = await github.rest.issues.get({ owner, repo, issue_number });
                removed = !response.data.labels.some(
                  label => (typeof label === "string" ? label : label.name) === claim,
                );
              } catch (error) {
                core.warning(`Could not verify removal of ${claim}: ${error.message}`);
                removed = false;
              }
            }
            if (!removed) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [claim],
                });
              } catch (error) {
                core.warning(`Could not restore ${claim}: ${error.message}`);
              }
              core.setFailed(`Could not verify removal of ${claim}; restoration was attempted.`);
            }

      - name: Publish observability report
        if: always()
        env:
          AUTOPILOT_DB: ${{ runner.temp }}/devin-issue-autopilot-report.db
          AUTOPILOT_REPORT_REVISION: ong6/devin-issue-autopilot@${{ env.AUTOPILOT_REVISION }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd controller
          python -m autopilot report --devin
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

  report:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'report'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout pinned issue controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ong6/devin-issue-autopilot
          ref: ${{ env.AUTOPILOT_REVISION }}
          path: controller
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install issue controller
        run: python -m pip install ./controller

      - name: Publish observability report
        env:
          AUTOPILOT_DB: ${{ runner.temp }}/devin-issue-autopilot-report.db
          AUTOPILOT_REPORT_REVISION: ong6/devin-issue-autopilot@${{ env.AUTOPILOT_REVISION }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd controller
          python -m autopilot report --devin
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload observability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devin-issue-autopilot-report
          path: controller/reports/summary.md
          if-no-files-found: error
          retention-days: 30

  daily-report:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout pinned issue controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ong6/devin-issue-autopilot
          ref: ${{ env.AUTOPILOT_REVISION }}
          path: controller
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install issue controller
        run: python -m pip install ./controller

      - name: Rebuild observability report
        env:
          AUTOPILOT_DB: ${{ runner.temp }}/devin-issue-autopilot-report.db
          AUTOPILOT_REPORT_REVISION: ong6/devin-issue-autopilot@${{ env.AUTOPILOT_REVISION }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          cd controller
          python -m autopilot report --devin
          cat reports/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload observability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: devin-issue-autopilot-report
          path: controller/reports/summary.md
          if-no-files-found: error
          retention-days: 30
