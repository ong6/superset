name: Devin issue automation

on:
  issues:
    types: [opened, reopened, labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to remediate"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: devin-issue-${{ github.repository_id }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       (github.event.action == 'opened' ||
        github.event.action == 'reopened' ||
        (github.event.action == 'labeled' &&
         (github.event.label.name == 'devin-fix' ||
          github.event.label.name == 'devin-retry')))) ||
      github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Authorize and claim issue
        id: claim
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const actor = context.actor;

            function skip(message) {
              core.warning(message);
              core.setOutput("claimed", "false");
            }

            if (context.eventName === "issue_comment") {
              const command = (context.payload.comment.body || "").trim().toLowerCase();
              if (
                context.payload.issue.pull_request ||
                !["/devin fix", "/devin retry"].includes(command)
              ) {
                skip("Ignoring non-Devin issue comment.");
                return;
              }
            }

            const labelDefinitions = [
              ["devin-fix", "ededed", "Authorized maintainer requested bounded remediation"],
              ["devin-retry", "D4C5F9", "Start a new bounded remediation generation"],
              ["devin-verified", "0E8A16", "Remediation PR passed configured verification"],
              ["devin-needs-human", "B60205", "Remediation stopped and needs maintainer attention"],
              ["devin-running", "1D76DB", "A bounded Devin remediation run owns this issue"],
              ["devin-exclude", "000000", "Opt this issue out of Devin automation"],
              ["devin-triaging", "FBCA04", "A bounded Devin triage run owns this issue"],
              ["devin-triaged", "C5DEF5", "Devin posted an issue triage brief"],
              ["devin-needs-maintainer", "BFDADC", "Maintainer decision required before automation proceeds"],
              ["devin-needs-info", "FEF2C0", "More reporter information is needed"],
              ["devin-triage-bug", "D73A4A", "Devin classified this issue as a bug"],
              ["devin-triage-feature", "A2EEEF", "Devin classified this issue as a feature request"],
              ["devin-triage-docs", "0075CA", "Devin classified this issue as documentation"],
              ["devin-triage-question", "D876E3", "Devin classified this issue as a question"],
              ["devin-triage-security", "EE0701", "Devin classified this issue as security-sensitive"],
              ["devin-triage-other", "EDEDED", "Devin could not classify this issue into a standard type"],
            ];
            for (const [name, color, description] of labelDefinitions) {
              try {
                await github.rest.issues.updateLabel({
                  owner,
                  repo,
                  name,
                  color,
                  description,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.updateLabel({
                    owner,
                    repo,
                    name,
                    color,
                    description,
                  });
                }
              }
            }

            let mode = "";
            let purpose = "";
            let requestedAt = "";
            const event = context.eventName;
            const action = context.payload.action || "";
            if (event === "workflow_dispatch") {
              mode = "remediate";
              purpose = "fix";
              requestedAt = new Date().toISOString();
            } else if (event === "issues") {
              if (action === "opened" || action === "reopened") {
                mode = "triage";
                purpose = "triage";
                requestedAt = context.payload.issue.updated_at ||
                  context.payload.issue.created_at;
              } else if (
                action === "labeled" &&
                ["devin-fix", "devin-retry"].includes(context.payload.label.name)
              ) {
                mode = "remediate";
                purpose = context.payload.label.name === "devin-retry" ? "retry" : "fix";
                requestedAt = context.payload.issue.updated_at ||
                  new Date().toISOString();
              } else {
                skip(`Ignoring issue action ${action}.`);
                return;
              }
            } else if (event === "issue_comment") {
              if (context.payload.issue.pull_request) {
                skip("Ignoring pull request comment.");
                return;
              }
              const command = (context.payload.comment.body || "").trim().toLowerCase();
              if (["/devin fix", "/devin retry"].includes(command)) {
                mode = "remediate";
                purpose = command.endsWith("retry") ? "retry" : "fix";
                requestedAt = context.payload.comment.created_at;
              } else {
                skip("Ignoring non-Devin issue comment.");
                return;
              }
            }

            if (!mode || !purpose || !requestedAt) {
              skip("No actionable Devin mode was selected.");
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });
            const labels = issue.labels.map(label =>
              typeof label === "string" ? label : label.name,
            );

            if (labels.includes("devin-exclude")) {
              skip(`Issue #${issue_number} is excluded from Devin automation.`);
              return;
            }

            if (
              event === "issues" &&
              action === "labeled" &&
              !labels.includes(context.payload.label.name)
            ) {
              skip(`Trigger label ${context.payload.label.name} is no longer present.`);
              return;
            }

            if (mode === "remediate") {
              let permission = "none";
              try {
                const response = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: actor,
                });
                permission = response.data.permission;
              } catch (error) {
                if (error.status !== 404) throw error;
              }
              const authorized = ["admin", "maintain", "write"].includes(
                permission,
              );
              if (!authorized) {
                skip(
                  `Ignoring remediation request from ${actor} (${permission}).`,
                );
                return;
              }
            }

            const crypto = require("crypto");
            const requestKey = `${issue_number}:${purpose}:${requestedAt}`;
            const digest = crypto.createHash("sha256").update(requestKey)
              .digest("hex").slice(0, 16);
            const marker = mode === "triage"
              ? `<!-- devin-triage-request:${digest} -->`
              : `<!-- devin-issue-autopilot:${digest} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
              per_page: 100,
            });
            if (comments.some(comment =>
              comment.user?.login === "github-actions[bot]" &&
              (comment.body || "").includes(marker)
            )) {
              skip(`Request ${requestKey} already reached a terminal outcome.`);
              return;
            }

            const claimLabel = mode === "triage" ? "devin-triaging" : "devin-running";
            const activeClaim = ["devin-triaging", "devin-running"].find(
              label => labels.includes(label),
            );
            if (activeClaim) {
              skip(`Issue #${issue_number} already has active ${activeClaim}.`);
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: [claimLabel],
            });
            core.setOutput("claimed", "true");
            core.setOutput("mode", mode);
            core.setOutput("purpose", purpose);
            core.setOutput("actor", actor);
            core.setOutput("requested_at", requestedAt);
            core.setOutput("claim_label", claimLabel);

      - name: Checkout repository
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install issue controller
        if: steps.claim.outputs.claimed == 'true'
        run: python -m pip install ./devin-issue-autopilot

      - name: Run bounded issue automation
        if: steps.claim.outputs.claimed == 'true'
        env:
          AUTOPILOT_DAILY_ACU_CAP: "20"
          AUTOPILOT_DB: ${{ runner.temp }}/devin-issue-autopilot.db
          AUTOPILOT_MODE: ${{ steps.claim.outputs.mode }}
          AUTOPILOT_PURPOSE: ${{ steps.claim.outputs.purpose }}
          AUTOPILOT_REQUEST_ACTOR: ${{ steps.claim.outputs.actor }}
          AUTOPILOT_REQUEST_AT: ${{ steps.claim.outputs.requested_at }}
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$AUTOPILOT_MODE" = "triage" ]; then
            python -m autopilot triage \
              --issue "$ISSUE_NUMBER" \
              --actor "$AUTOPILOT_REQUEST_ACTOR" \
              --requested-at "$AUTOPILOT_REQUEST_AT"
          else
            python -m autopilot once \
              --issue "$ISSUE_NUMBER" \
              --actor "$AUTOPILOT_REQUEST_ACTOR" \
              --requested-at "$AUTOPILOT_REQUEST_AT" \
              --purpose "$AUTOPILOT_PURPOSE"
          fi

      - name: Release issue claim
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          AUTOPILOT_CLAIM_LABEL: ${{ steps.claim.outputs.claim_label }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const claim = process.env.AUTOPILOT_CLAIM_LABEL;
            if (!claim) {
              core.setFailed("Claim label output is missing.");
              return;
            }
            let removed = false;
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: claim,
                });
                removed = true;
                break;
              } catch (error) {
                if (error.status === 404) {
                  removed = true;
                  break;
                }
                core.warning(`Attempt ${attempt} could not remove ${claim}: ${error.message}`);
                if (attempt < 3) {
                  await new Promise(resolve => setTimeout(resolve, attempt * 1000));
                }
              }
            }
            if (removed) {
              try {
                const response = await github.rest.issues.get({ owner, repo, issue_number });
                removed = !response.data.labels.some(
                  label => (typeof label === "string" ? label : label.name) === claim,
                );
              } catch (error) {
                core.warning(`Could not verify removal of ${claim}: ${error.message}`);
                removed = false;
              }
            }
            if (!removed) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [claim],
                });
              } catch (error) {
                core.warning(`Could not restore ${claim}: ${error.message}`);
              }
              core.setFailed(`Could not verify removal of ${claim}; restoration was attempted.`);
            }
