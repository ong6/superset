name: Devin issue remediation

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to remediate"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: devin-issue-${{ github.repository_id }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  remediate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'devin-fix'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      checks: read
      contents: read
      issues: write
      pull-requests: read
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
    steps:
      - name: Authorize and claim issue
        id: claim
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            const actor = context.actor;
            const { data: permission } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: actor,
              });
            const authorized = ["admin", "maintain", "write"].includes(
              permission.permission,
            );

            if (!authorized) {
              core.warning(
                `Ignoring remediation request from ${actor} (${permission.permission}).`,
              );
              core.setOutput("claimed", "false");
              return;
            }

            const { data: issue } = await github.rest.issues.get({
              owner,
              repo,
              issue_number,
            });
            const labels = issue.labels.map(label =>
              typeof label === "string" ? label : label.name,
            );

            if (!labels.includes("devin-fix")) {
              core.warning(`Issue #${issue_number} does not have devin-fix.`);
              core.setOutput("claimed", "false");
              return;
            }
            if (labels.includes("devin-running")) {
              core.warning(`Issue #${issue_number} already has an active claim.`);
              core.setOutput("claimed", "false");
              return;
            }

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number,
              labels: ["devin-running"],
            });
            core.setOutput("claimed", "true");

      - name: Checkout repository
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        if: steps.claim.outputs.claimed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install issue controller
        if: steps.claim.outputs.claimed == 'true'
        run: python -m pip install ./devin-issue-autopilot

      - name: Run bounded remediation
        if: steps.claim.outputs.claimed == 'true'
        env:
          AUTOPILOT_DAILY_ACU_CAP: "20"
          AUTOPILOT_DB: ${{ runner.temp }}/devin-issue-autopilot.db
          DEVIN_API_KEY: ${{ secrets.DEVIN_API_KEY }}
          DEVIN_ORG_ID: ${{ vars.DEVIN_ORG_ID }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m autopilot once --issue "$ISSUE_NUMBER"

      - name: Release issue claim
        if: always() && steps.claim.outputs.claimed == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);
            try {
              await github.rest.issues.removeLabel({
                owner,
                repo,
                issue_number,
                name: "devin-running",
              });
            } catch (error) {
              if (error.status !== 404) throw error;
            }
